<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASSA PRO</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --blue-title: #0000ff;
            --gray-border: #cccccc;
            --green-btn: #a2f0a2;
            --red-btn: #f0a2a2;
            --pink-btn: #f0a2f0;
            --bottom-btn: #f5f5f5;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: var(--bg-color);
            box-sizing: border-box;
            user-select: none;
        }

        /* Navigointi */
        .nav-tabs {
            display: flex;
            background: #333;
            margin: -10px -10px 10px -10px;
        }
        .nav-tabs button {
            background: #333;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .nav-tabs button.active {
            background: #007bff;
            font-weight: bold;
        }

        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* Kassan asettelu */
        .top-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .left-top {
            border: 2px solid var(--gray-border);
            padding: 15px;
            background: white;
        }

        .left-top h2 {
            color: var(--blue-title);
            margin: 0 0 10px 0;
            font-size: 28px;
        }

        .input-field {
            width: 100%;
            font-size: 24px;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--gray-border);
            margin-bottom: 15px;
        }

        .seller-row {
            font-size: 20px;
            font-weight: bold;
        }
        .seller-row select {
            font-size: 18px;
            padding: 5px;
            width: 150px;
        }

        .receipt-log {
            background: black;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            height: 140px;
            overflow-y: auto;
            border: 2px solid var(--gray-border);
            font-size: 16px;
            line-height: 1.4;
        }

        .print-receipt-check {
            margin: 10px 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Ostoslista ja Oikeat painikkeet */
        .middle-section {
            display: grid;
            grid-template-columns: 1fr 110px;
            gap: 10px;
            height: 380px;
        }

        .receipt-view {
            background: white;
            border: 2px solid var(--gray-border);
            overflow-y: auto;
        }

        .receipt-item {
            display: flex;
            justify-content: space-between;
            background: #3b73c4;
            color: white;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #2a528f;
            cursor: pointer;
        }
        .receipt-item.selected {
            background: #1d3b6b;
            border: 2px solid yellow;
        }

        .right-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .right-buttons button {
            flex: 1;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid var(--gray-border);
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-green { background-color: var(--green-btn); }
        .btn-red { background-color: var(--red-btn); }
        .btn-pink { background-color: var(--pink-btn); }

        /* Alarivin painikkeet */
        .bottom-buttons {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 4px;
            margin-top: 15px;
        }

        .bottom-buttons button {
            background: var(--bottom-btn);
            border: 2px solid var(--gray-border);
            padding: 10px 1px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            min-height: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .bottom-buttons button span {
            color: #555;
            font-size: 10px;
            margin-bottom: 3px;
        }

        /* Maksupääte-simulaatio overlay */
        .terminal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .terminal-box {
            background: #2c3e50;
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            border: 4px solid #34495e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .terminal-screen {
            background: #95a5a6;
            color: #111;
            font-family: monospace;
            font-size: 18px;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border: 3px solid #7f8c8d;
        }
        .terminal-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Tuotehallinta */
        .product-management {
            background: white;
            padding: 20px;
            border: 2px solid var(--gray-border);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            max-width: 400px;
            padding: 8px;
            font-size: 16px;
        }
        .mgmt-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .product-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .product-table th, .product-table td {
            border: 1px solid var(--gray-border);
            padding: 10px;
            text-align: left;
        }
        .product-table th { background: #eee; }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <button id="tab-kassa" class="active" onclick="switchPage('kassa')">KASSAOHJELMA</button>
        <button id="tab-tuotteet" onclick="switchPage('tuotteet')">TUOTEHALLINTA</button>
    </div>

    <div id="page-kassa" class="page active">
        <div class="top-section">
            <div class="left-top">
                <h2>Tuotekoodi tai summa</h2>
                <input type="text" id="barcode-input" class="input-field" autofocus placeholder="Syötä koodi ja paina Enter" onkeypress="handleBarcodeKey(event)">
                <div class="seller-row">
                    Myyjä: 
                    <select id="seller-select">
                        <option value="demo">demo</option>
                        <option value="Kalle">Kalle</option>
                        <option value="Sara">Sara</option>
                    </select>
                </div>
            </div>
            
            <div class="receipt-log" id="receipt-log">
                Kassa valmis. Syötä tuotekoodi (esim. 1001) tai suora summa (esim. 12,50).
            </div>
        </div>

        <div class="print-receipt-check">
            <input type="checkbox" id="print-receipt" checked> Tulosta kuitti
        </div>

        <div class="middle-section">
            <div class="receipt-view" id="receipt-items-container">
                </div>
            
            <div class="right-buttons">
                <button class="btn-green" onclick="modifyQuantity(1)">+</button>
                <button class="btn-green" onclick="modifyQuantity(-1)">-</button>
                <button class="btn-green" onclick="alert('Kappalemäärän muutos aktiivinen')">kpl</button>
                <button class="btn-red" onclick="deleteSelected()">del</button>
                <button class="btn-green">txt</button>
                <button class="btn-pink" onclick="applyRowDiscount()">Rivi ale</button>
                <button class="btn-pink" onclick="applyTotalDiscount()">Kok. ale</button>
                <button class="btn-pink" style="background-color: #a2d2f0;" onclick="finalizeSale('Lahjakortti')">Lahjak.</button>
            </div>
        </div>

        <div class="bottom-buttons">
            <button onclick="clearSale()"><span>F1</span>Uusi</button>
            <button onclick="alert('Hae asiakas')"><span>F2</span>Hae asiakas</button>
            <button onclick="alert('Hae tuote valikosta')"><span>F3</span>Hae tuote</button>
            <button onclick="switchPage('tuotteet')"><span>F4</span>Uusi tuote</button>
            <button class="btn-green" onclick="finalizeSale('Käteinen')"><span>F5</span>Käteinen</button>
            <button class="btn-green" onclick="startCardPaymentSim()"><span>F6</span>Pankkik.</button>
            <button class="btn-green" onclick="startCardPaymentSim()"><span>F7</span>Luottok.</button>
            <button class="btn-green" style="background-color: #bbf;" onclick="finalizeSale('Lahjakortti')"><span>F8</span>Lahjak.</button>
            <button onclick="finalizeSale('Lasku')"><span>F9</span>Lasku</button>
            <button onclick="alert('Hae vanha lasku')"><span>F10</span>Hae lasku</button>
            <button onclick="alert('Päivämäärän muutos')"><span>F11</span>Päiväys</button>
            <button onclick="alert('Raportit tulostettu')"><span>F12</span>Raportit</button>
            <button onclick="window.close(); alert('Uloskirjauduttu');"><span>F13</span>ULOS</button>
        </div>
    </div>

    <div class="terminal-overlay" id="terminal-screen-overlay">
        <div class="terminal-box">
            <h3 style="margin-top:0;">INGENICO SIMULAATTORI</h3>
            <div class="terminal-screen" id="terminal-status-text">
                ODOTTAA KORTTIA...
            </div>
            <p id="terminal-amount-text" style="font-weight:bold; margin-bottom:20px;"></p>
            <button class="terminal-btn" onclick="cancelCardPayment()">Peruuta maksu</button>
        </div>
    </div>

    <div id="page-tuotteet" class="page">
        <div class="product-management">
            <h2>Tuotehallinta / Varasto</h2>
            <div class="form-group">
                <label>Tuotekoodi:</label>
                <input type="text" id="p-code" placeholder="esim. 1001">
            </div>
            <div class="form-group">
                <label>Tuotteen nimi:</label>
                <input type="text" id="p-name" placeholder="esim. Kevyt maito 1.5%">
            </div>
            <div class="form-group">
                <label>Hinta (€):</label>
                <input type="number" step="0.01" id="p-price" placeholder="esim. 1.50">
            </div>
            <button class="mgmt-btn" onclick="addNewProduct()">Tallenna tuote</button>

            <h3>Tallennetut tuotteet</h3>
            <table class="product-table">
                <thead>
                    <tr><th>Koodi</th><th>Tuotenimi</th><th>Hinta (€)</th><th>Toiminnot</th></tr>
                </thead>
                <tbody id="product-list-tbody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Alustavat tuotteet
        let products = {
            "1001": { name: "Kevyt maito 1.5% (ml)", price: 1.50 },
            "1002": { name: "Ruisleipä 500g", price: 2.20 },
            "1003": { name: "Kahvi 500g Juhla", price: 5.95 }
        };

        let currentCart = [];
        let selectedIndex = -1;
        let receiptCounter = 1164451;
        let globalDiscountPercent = 0; // Koko aletiedot
        let terminalTimeout = null;

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            document.getElementById(`tab-${pageId}`).classList.add('active');
            if(pageId === 'kassa') document.getElementById('barcode-input').focus();
        }

        function handleBarcodeKey(e) {
            if (e.key === 'Enter') {
                let code = document.getElementById('barcode-input').value.trim();
                if (code !== "") addProductToCart(code);
                document.getElementById('barcode-input').value = "";
            }
        }

        function addProductToCart(code) {
            let product = products[code];
            if (!product) {
                let parsedPrice = parseFloat(code.replace(',', '.'));
                if (!isNaN(parsedPrice)) {
                    product = { name: "Yleistuote / Summa", price: parsedPrice };
                } else {
                    alert("Tuotetta ei löydy!");
                    return;
                }
            }

            currentCart.push({
                name: product.name,
                price: product.price,
                qty: 1,
                discountPercent: 0 // Rivikohtainen alennusprosentti
            });

            selectedIndex = currentCart.length - 1;
            updateCartDisplay();
        }

        // Laskee yhden rivin lopullisen hinnan alennuksen jälkeen
        function getRowTotal(item) {
            let discountedUnitPrice = item.price * (1 - item.discountPercent / 100);
            return discountedUnitPrice * item.qty;
        }

        // Laskee koko kuitin loppusumman (huomioi rivialet + kokoalen)
        function getCartTotal() {
            let total = currentCart.reduce((sum, item) => sum + getRowTotal(item), 0);
            return total * (1 - globalDiscountPercent / 100);
        }

        function updateCartDisplay() {
            const container = document.getElementById('receipt-items-container');
            container.innerHTML = "";

            currentCart.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `receipt-item ${index === selectedIndex ? 'selected' : ''}`;
                div.onclick = () => {
                    selectedIndex = index;
                    updateCartDisplay();
                };

                let rowTotal = getRowTotal(item).toFixed(2);
                let aleTeksti = item.discountPercent > 0 ? ` [-${item.discountPercent}%]` : '';
                let qtyText = item.qty > 1 || item.discountPercent > 0 ? `${item.qty} kpl x ${item.price.toFixed(2)}€${aleTeksti} = ` : '';
                
                div.innerHTML = `
                    <span>${item.name}</span>
                    <span>${qtyText}${rowTotal.replace('.', ',')} €</span>
                `;
                container.appendChild(div);
            });

            if (currentCart.length > 0) {
                let latest = currentCart[currentCart.length - 1];
                updateLogDisplay(latest);
            }
        }

        function updateLogDisplay(latestProduct) {
            const logBox = document.getElementById('receipt-log');
            let dateStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
            let subtotal = getCartTotal().toFixed(2);
            let kokoAleTeksti = globalDiscountPercent > 0 ? `KOKONAISALE AKTIVOITU: -${globalDiscountPercent}%\n` : '';

            logBox.innerHTML = `
Tapahtuma ${dateStr}K${receiptCounter} päivitetty<br>
Viimeisin tuote: ${latestProduct.name}<br>
****<br>
${kokoAleTeksti}VÄLISUMMA: ${subtotal.replace('.', ',')} €
            `;
        }

        // RIVI ALE (Vain valitulle tuoteriville)
        function applyRowDiscount() {
            if (selectedIndex < 0 || !currentCart[selectedIndex]) {
                alert("Valitse ensin tuoterivi kuitilta!");
                return;
            }
            let aleInput = prompt("Syötä rivialennus prosentteina (0-100):", "10");
            let ale = parseFloat(aleInput);
            if (!isNaN(ale) && ale >= 0 && ale <= 100) {
                currentCart[selectedIndex].discountPercent = ale;
                updateCartDisplay();
            } else if (aleInput !== null) {
                alert("Virheellinen prosenttimäärä.");
            }
        }

        // KOKO ALE (Koko kuitun loppusummasta)
        function applyTotalDiscount() {
            if (currentCart.length === 0) {
                alert("Ostoskori on tyhjä!");
                return;
            }
            let aleInput = prompt("Syötä koko kuitin alennusprosentti (0-100):", "10");
            let ale = parseFloat(aleInput);
            if (!isNaN(ale) && ale >= 0 && ale <= 100) {
                globalDiscountPercent = ale;
                if(currentCart.length > 0) updateCartDisplay();
            } else if (aleInput !== null) {
                alert("Virheellinen prosenttimäärä.");
            }
        }

        function modifyQuantity(amount) {
            if (selectedIndex >= 0 && currentCart[selectedIndex]) {
                currentCart[selectedIndex].qty += amount;
                if (currentCart[selectedIndex].qty <= 0) {
                    deleteSelected();
                } else {
                    updateCartDisplay();
                }
            }
        }

        function deleteSelected() {
            if (selectedIndex >= 0 && currentCart[selectedIndex]) {
                currentCart.splice(selectedIndex, 1);
                selectedIndex = currentCart.length - 1;
                updateCartDisplay();
                if (currentCart.length === 0) {
                    globalDiscountPercent = 0;
                    document.getElementById('receipt-log').innerHTML = "Ostoskori tyhjä.";
                }
            }
        }

        function clearSale() {
            currentCart = [];
            selectedIndex = -1;
            globalDiscountPercent = 0;
            updateCartDisplay();
            document.getElementById('receipt-log').innerHTML = "Uusi tapahtuma aloitettu.";
            document.getElementById('barcode-input').focus();
        }

        // ================= INTEGRATION SIMULATION (Pankkikortti) =================
        function startCardPaymentSim() {
            if (currentCart.length === 0) {
                alert("Ostoskori on tyhjä!");
                return;
            }
            let total = getCartTotal().toFixed(2);
            
            // Avataan simuloitu päätteen ruutu
            document.getElementById('terminal-amount-text').innerText = `Summa: ${total.replace('.', ',')} €`;
            document.getElementById('terminal-status-text').innerText = "ODOTTAA KORTTIA...";
            document.getElementById('terminal-screen-overlay').style.display = "flex";

            // Vaihe 1: Kortti havaittu (2 sekunnin päästä)
            terminalTimeout = setTimeout(() => {
                document.getElementById('terminal-status-text').innerText = "LUETAAN KORTTIA...";
                
                // Vaihe 2: Maksu hyväksytty (toisen 2 sekunnin päästä)
                terminalTimeout = setTimeout(() => {
                    document.getElementById('terminal-status-text').innerText = "HYVÄKSYTTY. KIITOS!";
                    
                    // Suljetaan pääte ja viimeistellään myynti kantaan
                    terminalTimeout = setTimeout(() => {
                        document.getElementById('terminal-screen-overlay').style.display = "none";
                        finalizeSale('Pankkikortti (Maksupääte)');
                    }, 1200);

                }, 2000);

            }, 2000);
        }

        function cancelCardPayment() {
            clearTimeout(terminalTimeout);
            document.getElementById('terminal-screen-overlay').style.display = "none";
            alert("Maksupääteistunto peruutettu myyjän toimesta.");
        }

        // Myynnin lopullinen kirjaus
        function finalizeSale(method) {
            if (currentCart.length === 0) {
                alert("Ostoskori on tyhjä!");
                return;
            }

            let total = getCartTotal().toFixed(2);
            let checkPrint = document.getElementById('print-receipt').checked;
            
            let receiptText = `=== KUITTI ===\nMyyjä: ${document.getElementById('seller-select').value}\nMaksutapa: ${method}\n\n`;
            currentCart.forEach(item => {
                let rAle = item.discountPercent > 0 ? ` (-${item.discountPercent}%)` : '';
                receiptText += `${item.name} x ${item.qty} = ${getRowTotal(item).toFixed(2)} €${rAle}\n`;
            });
            if(globalDiscountPercent > 0) {
                receiptText += `Koko aletunnus: -${globalDiscountPercent}%\n`;
            }
            receiptText += `\nYHTEENSÄ: ${total} €\n==============`;

            if (checkPrint) {
                alert(receiptText + "\n\n(Tapahtuma valmis!)");
            } else {
                alert(`Myynti tallennettu (${method}): ${total} €`);
            }

            receiptCounter++;
            clearSale();
        }

        // --- TUOTEHALLINTA ---
        function updateProductTable() {
            const tbody = document.getElementById('product-list-tbody');
            tbody.innerHTML = "";
            for (let code in products) {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${code}</strong></td>
                    <td>${products[code].name}</td>
                    <td>${products[code].price.toFixed(2)} €</td>
                    <td><button style="background:red; color:white; border:none; padding:3px 8px; cursor:pointer;" onclick="deleteProduct('${code}')">Poista</button></td>
                `;
                tbody.appendChild(row);
            }
        }

        function addNewProduct() {
            let code = document.getElementById('p-code').value.trim();
            let name = document.getElementById('p-name').value.trim();
            let price = parseFloat(document.getElementById('p-price').value);

            if (code === "" || name === "" || isNaN(price)) {
                alert("Tarkista kentät!");
                return;
            }

            products[code] = { name: name, price: price };
            document.getElementById('p-code').value = "";
            document.getElementById('p-name').value = "";
            document.getElementById('p-price').value = "";
            updateProductTable();
        }

        function deleteProduct(code) {
            if(confirm(`Poistetaanko koodi ${code}?`)) {
                delete products[code];
                updateProductTable();
            }
        }

        updateProductTable();
    </script>
</body>
</html>
